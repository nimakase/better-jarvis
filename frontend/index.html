<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贾维斯</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f0f;
    color: #e8e8e8;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 顶栏 */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid #222;
    background: #141414;
  }
  header h1 { font-size: 17px; font-weight: 600; color: #fff; }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #3a3a3a;
    transition: background 0.3s;
  }
  .status-dot.online { background: #4ade80; }
  .status-dot.typing { background: #facc15; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  header .actions { margin-left: auto; display: flex; gap: 8px; }
  .btn-sm {
    font-size: 12px; padding: 5px 10px;
    background: #222; border: 1px solid #333;
    color: #aaa; border-radius: 6px; cursor: pointer;
  }
  .btn-sm:hover { background: #2a2a2a; color: #fff; }

  /* 消息区 */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    scroll-behavior: smooth;
  }

  .message {
    display: flex;
    gap: 12px;
    padding: 10px 20px;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
  }
  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    flex-shrink: 0;
  }
  .message.user .avatar      { background: #2563eb; color: #fff; }
  .message.assistant .avatar { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
  .message.system .avatar    { background: #1a1a1a; color: #555; }

  .bubble {
    max-width: calc(100% - 50px);
    line-height: 1.65;
    font-size: 14.5px;
  }
  .message.user .bubble {
    background: #1d4ed8;
    color: #fff;
    border-radius: 14px 4px 14px 14px;
    padding: 10px 14px;
  }
  .message.assistant .bubble {
    color: #e2e8f0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .message.system .bubble {
    color: #555;
    font-size: 12px;
    font-family: monospace;
    background: #111;
    border-radius: 6px;
    padding: 8px 12px;
    white-space: pre-wrap;
    overflow-x: auto;
  }

  /* 文件预览气泡 */
  .file-bubble {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1e3a5f;
    border: 1px solid #2563eb44;
    border-radius: 10px;
    padding: 10px 14px;
    max-width: 320px;
  }
  .file-icon { font-size: 22px; flex-shrink: 0; }
  .file-info { overflow: hidden; }
  .file-name { font-size: 13px; font-weight: 600; color: #93c5fd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 11px; color: #64748b; margin-top: 2px; }

  .tool-indicator {
    font-size: 12px;
    color: #64748b;
    padding: 4px 0;
    font-style: italic;
  }

  /* 代码审查卡片 */
  .code-review-card {
    max-width: 780px;
    margin: 10px 20px;
    margin-left: calc(20px + 44px);  /* 对齐助手气泡 */
    border: 1px solid #1e3a5f;
    border-radius: 10px;
    overflow: hidden;
    background: #0d1117;
  }
  .code-review-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #161b22;
    border-bottom: 1px solid #1e3a5f;
  }
  .code-review-title {
    font-size: 13px;
    font-weight: 600;
    color: #58a6ff;
    font-family: monospace;
  }
  .code-review-actions { display: flex; gap: 8px; }
  .btn-activate {
    font-size: 12px; padding: 5px 14px;
    background: #238636; border: 1px solid #2ea043;
    color: #fff; border-radius: 6px; cursor: pointer;
    font-weight: 600;
  }
  .btn-activate:hover { background: #2ea043; }
  .btn-activate:disabled { background: #1a3a1f; color: #666; cursor: not-allowed; }
  .btn-dismiss {
    font-size: 12px; padding: 5px 10px;
    background: #21262d; border: 1px solid #30363d;
    color: #8b949e; border-radius: 6px; cursor: pointer;
  }
  .btn-dismiss:hover { background: #30363d; }
  .code-block {
    padding: 14px;
    overflow-x: auto;
    font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
    font-size: 12.5px;
    line-height: 1.6;
    color: #e6edf3;
    white-space: pre;
    max-height: 420px;
    overflow-y: auto;
  }
  .code-review-footer {
    padding: 8px 14px;
    font-size: 11px;
    color: #484f58;
    border-top: 1px solid #161b22;
  }

  /* 验证横幅 */
  .validation-banner {
    padding: 8px 14px;
    font-size: 12px;
    line-height: 1.5;
    border-bottom: 1px solid #161b22;
  }
  .validation-banner ul { margin: 4px 0 0 16px; }
  .validation-banner li { margin: 2px 0; }
  .validation-banner.error   { background: #2d1117; color: #f85149; }
  .validation-banner.warning { background: #2d2500; color: #e3b341; }
  .validation-banner.ok      { background: #0d2818; color: #3fb950; }

  /* 拖拽遮罩 */
  #drop-overlay {
    display: none;
    position: fixed; inset: 0;
    background: #0f0f0fcc;
    border: 3px dashed #3b82f6;
    z-index: 100;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #60a5fa;
    pointer-events: none;
  }
  #drop-overlay.active { display: flex; }

  /* 输入区 */
  footer {
    padding: 12px 20px 16px;
    border-top: 1px solid #1e1e1e;
    background: #141414;
  }

  /* 上传进度条 */
  #upload-bar {
    display: none;
    max-width: 860px;
    margin: 0 auto 8px;
    height: 3px;
    background: #1e1e1e;
    border-radius: 2px;
    overflow: hidden;
  }
  #upload-bar.active { display: block; }
  #upload-progress {
    height: 100%;
    background: #3b82f6;
    width: 0%;
    transition: width 0.2s;
  }

  .input-row {
    display: flex;
    gap: 8px;
    max-width: 860px;
    margin: 0 auto;
    align-items: flex-end;
  }

  /* 上传按钮 */
  #upload-btn {
    width: 44px; height: 44px;
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #666; font-size: 20px;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  #upload-btn:hover { background: #2a2a2a; color: #aaa; border-color: #3b82f6; }

  #input {
    flex: 1;
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #e8e8e8;
    font-size: 14px;
    padding: 11px 14px;
    resize: none;
    line-height: 1.5;
    max-height: 160px;
    min-height: 44px;
    outline: none;
    font-family: inherit;
  }
  #input:focus { border-color: #3b5bdb; }
  #input::placeholder { color: #3a3a3a; }

  #send-btn {
    width: 44px; height: 44px;
    background: #2563eb;
    border: none; border-radius: 10px;
    color: #fff; font-size: 18px;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  #send-btn:hover { background: #1d4ed8; }
  #send-btn:disabled { background: #1e2a4a; cursor: not-allowed; }

  .hint { font-size: 11px; color: #2a2a2a; text-align: center; margin-top: 8px; }
</style>
</head>
<body>

<div id="drop-overlay">松开鼠标上传文件 📄</div>

<header>
  <div class="status-dot" id="dot"></div>
  <h1>贾维斯</h1>
  <div class="actions">
    <button class="btn-sm" onclick="showMemory()">记忆库</button>
    <button class="btn-sm" onclick="resetSession()">重置会话</button>
  </div>
</header>

<div id="messages"></div>

<footer>
  <div id="upload-bar"><div id="upload-progress"></div></div>
  <div class="input-row">
    <button id="upload-btn" title="上传文件（或直接拖拽到页面）" onclick="triggerUpload()">📎</button>
    <input type="file" id="file-input" style="display:none"
      accept=".pdf,.docx,.doc,.xlsx,.xls,.xlsm,.pptx,.ppt,.csv,.txt,.md,.json,.yaml,.yml,.jpg,.jpeg,.png,.gif,.webp,.bmp"
      onchange="handleFileSelect(this.files[0])">
    <textarea id="input" placeholder="和贾维斯说话，或拖拽文件到页面…" rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">↑</button>
  </div>
  <p class="hint">Enter 发送 · Shift+Enter 换行 · 📎 或拖拽上传文件</p>
</footer>

<script>
const messagesEl  = document.getElementById("messages");
const inputEl     = document.getElementById("input");
const sendBtn     = document.getElementById("send-btn");
const dot         = document.getElementById("dot");
const uploadBar   = document.getElementById("upload-bar");
const uploadProg  = document.getElementById("upload-progress");
const dropOverlay = document.getElementById("drop-overlay");

let ws = null;
let currentBubble = null;

// ── WebSocket ──────────────────────────────────────────────────────────────

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws/chat`);
  ws.onopen  = () => { dot.className = "status-dot online"; addSystemMessage("已连接到贾维斯"); };
  ws.onclose = () => { dot.className = "status-dot"; addSystemMessage("连接断开，3秒后重连…"); setTimeout(connect, 3000); };
  ws.onerror = () => addSystemMessage("连接出错");

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "start") {
      dot.className = "status-dot typing";
      currentBubble = createAssistantBubble();
      sendBtn.disabled = true;

    } else if (msg.type === "chunk") {
      if (currentBubble) {
        if (msg.text.includes("⚙️")) {
          const span = document.createElement("span");
          span.className = "tool-indicator";
          span.textContent = msg.text.replace(/\n/g, "");
          currentBubble.appendChild(span);
        } else {
          currentBubble.appendChild(document.createTextNode(msg.text));
        }
        scrollToBottom();
      }

    } else if (msg.type === "end") {
      dot.className = "status-dot online";
      currentBubble = null;
      sendBtn.disabled = false;

    } else if (msg.type === "system") {
      addSystemMessage(msg.text);
      sendBtn.disabled = false;
      dot.className = "status-dot online";

    } else if (msg.type === "error") {
      addSystemMessage("错误：" + msg.text);
      sendBtn.disabled = false;
      dot.className = "status-dot online";

    } else if (msg.type === "code_review") {
      addCodeReviewCard(msg.name, msg.code, msg.message, msg.validation);
    }
  };
}

// ── 文件上传 ───────────────────────────────────────────────────────────────

function triggerUpload() {
  document.getElementById("file-input").click();
}

function handleFileSelect(file) {
  if (!file) return;
  uploadFile(file);
  // 重置 input，允许重复上传同一文件
  document.getElementById("file-input").value = "";
}

async function uploadFile(file) {
  // 显示文件气泡（上传中状态）
  addFileBubble(file.name, file.size, "上传中…");

  // 进度条
  uploadBar.classList.add("active");
  uploadProg.style.width = "30%";

  const formData = new FormData();
  formData.append("file", file);

  try {
    uploadProg.style.width = "70%";
    const resp = await fetch("/api/upload", { method: "POST", body: formData });
    if (!resp.ok) throw new Error(`上传失败 ${resp.status}`);
    const data = await resp.json();

    uploadProg.style.width = "100%";
    setTimeout(() => { uploadBar.classList.remove("active"); uploadProg.style.width = "0%"; }, 400);

    // 自动发送消息，带文件路径
    const prompt = `请读取并分析这个文件，告诉我里面的主要内容：${data.path}`;
    addUserMessage(`📄 ${file.name}`);
    ws.send(JSON.stringify({ message: prompt }));

  } catch (err) {
    uploadBar.classList.remove("active");
    addSystemMessage("上传失败：" + err.message);
  }
}

// ── 拖拽上传 ───────────────────────────────────────────────────────────────

let dragCounter = 0;

document.addEventListener("dragenter", (e) => {
  e.preventDefault();
  dragCounter++;
  dropOverlay.classList.add("active");
});
document.addEventListener("dragleave", () => {
  dragCounter--;
  if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove("active"); }
});
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => {
  e.preventDefault();
  dragCounter = 0;
  dropOverlay.classList.remove("active");
  const file = e.dataTransfer.files[0];
  if (file) uploadFile(file);
});

// ── 消息 UI ────────────────────────────────────────────────────────────────

function fileIcon(name) {
  const ext = name.split(".").pop().toLowerCase();
  const map = { pdf:"📕", docx:"📘", doc:"📘", xlsx:"📗", xls:"📗", xlsm:"📗",
                pptx:"📙", ppt:"📙", csv:"📊", txt:"📄", md:"📄",
                jpg:"🖼️", jpeg:"🖼️", png:"🖼️", gif:"🖼️", webp:"🖼️" };
  return map[ext] || "📄";
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/1048576).toFixed(1) + " MB";
}

function addFileBubble(name, size, status) {
  const wrap = document.createElement("div");
  wrap.className = "message user";
  wrap.innerHTML = `
    <div class="avatar">N</div>
    <div class="file-bubble">
      <div class="file-icon">${fileIcon(name)}</div>
      <div class="file-info">
        <div class="file-name">${escHtml(name)}</div>
        <div class="file-meta">${formatSize(size)} · ${status}</div>
      </div>
    </div>`;
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

function createAssistantBubble() {
  const wrap = document.createElement("div");
  wrap.className = "message assistant";
  wrap.innerHTML = `<div class="avatar">J</div><div class="bubble"></div>`;
  messagesEl.appendChild(wrap);
  scrollToBottom();
  return wrap.querySelector(".bubble");
}

function addUserMessage(text) {
  const wrap = document.createElement("div");
  wrap.className = "message user";
  wrap.innerHTML = `<div class="avatar">N</div><div class="bubble">${escHtml(text)}</div>`;
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

function addSystemMessage(text) {
  const wrap = document.createElement("div");
  wrap.className = "message system";
  wrap.innerHTML = `<div class="avatar">·</div><div class="bubble">${escHtml(text)}</div>`;
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ── 发送消息 ───────────────────────────────────────────────────────────────

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;
  addUserMessage(text);
  ws.send(JSON.stringify({ message: text }));
  inputEl.value = "";
  inputEl.style.height = "44px";
}

function resetSession() { ws.send(JSON.stringify({ message: "/reset" })); }
function showMemory()   { ws.send(JSON.stringify({ message: "/memory" })); }

// ── 代码审查卡片 ───────────────────────────────────────────────────────────

function addCodeReviewCard(name, code, message, validation) {
  const v = validation || { ok: true, errors: [], warnings: [] };
  const hasErrors   = v.errors   && v.errors.length > 0;
  const hasWarnings = v.warnings && v.warnings.length > 0;

  // 验证结果横幅
  let validationHtml = "";
  if (hasErrors) {
    const items = v.errors.map(e => `<li>${escHtml(e)}</li>`).join("");
    validationHtml += `<div class="validation-banner error">
      <strong>🚫 阻断：以下问题必须修复才能激活</strong><ul>${items}</ul></div>`;
  }
  if (hasWarnings) {
    const items = v.warnings.map(w => `<li>${escHtml(w)}</li>`).join("");
    validationHtml += `<div class="validation-banner warning">
      <strong>⚠️ 注意：请确认以下内容符合预期</strong><ul>${items}</ul></div>`;
  }
  if (!hasErrors && !hasWarnings) {
    validationHtml = `<div class="validation-banner ok">✅ 代码通过安全检查</div>`;
  }

  const card = document.createElement("div");
  card.className = "code-review-card";
  card.dataset.toolName = name;
  card.innerHTML = `
    <div class="code-review-header">
      <span class="code-review-title">🔧 skills/${name}/tool.py</span>
      <div class="code-review-actions">
        <button class="btn-activate" id="activate-${name}"
          onclick="activateTool('${name}')"
          ${hasErrors ? "disabled title='有阻断级错误，无法激活'" : ""}>
          ${hasErrors ? "❌ 无法激活" : "激活工具"}
        </button>
        <button class="btn-dismiss" onclick="this.closest('.code-review-card').remove()">忽略</button>
      </div>
    </div>
    ${validationHtml}
    <pre class="code-block">${escHtml(code)}</pre>
    <div class="code-review-footer">
      ${hasErrors
        ? "告诉贾维斯需要修改什么，或直接编辑 skills/" + name + "/tool.py"
        : "审查代码后点击「激活工具」，或告诉贾维斯需要修改什么"}
    </div>
  `;
  messagesEl.appendChild(card);
  scrollToBottom();
}

async function activateTool(name) {
  const btn = document.getElementById(`activate-${name}`);
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = "激活中…";

  try {
    const resp = await fetch(`/api/tools/${name}/activate`, { method: "POST" });
    const data = await resp.json();
    if (data.ok) {
      btn.textContent = "✅ 已激活";
      btn.style.background = "#1a3a1f";
      addSystemMessage(`工具 ${name} 已激活，现在可以直接使用了。`);
    } else {
      btn.disabled = false;
      btn.textContent = "激活";
      addSystemMessage(`激活失败：${data.message}`);
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "激活";
    addSystemMessage("激活请求失败：" + e.message);
  }
}

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

inputEl.addEventListener("input", () => {
  inputEl.style.height = "44px";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
});

connect();
</script>
</body>
</html>
